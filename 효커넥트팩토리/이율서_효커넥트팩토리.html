<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할머니 짐 들어드리기</title>
<style>
*{box-sizing:border-box;user-select:none;touch-action:none;}

/* 배경 이미지가 적용된 body 스타일 */
body{
    margin:0;
    /* 같은 폴더에 있는 '이미지.jpg' 파일을 배경으로 불러옵니다. */
    background-image: url('이미지.jpg');
    background-color: #9edcff; /* 이미지 로드 실패 시 나타나는 배경색 */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
}

/* 배경 위에서 글씨가 잘 보이도록 그림자 추가 */
h1{margin:8px; color:#333; text-shadow: 2px 2px 4px rgba(255,255,255,0.8);} 
#info{font-size:22px;font-weight:bold; color:#333; text-shadow: 1px 1px 3px rgba(255,255,255,0.8);}

#bar{width:80%;height:20px;margin:10px auto;border:3px solid #333;background:white;border-radius:20px;}
#timeBar{height:100%;width:100%;background:#43a047;border-radius:20px;}
#game{position:relative;height:75vh;overflow:hidden;}

#cloud{position:absolute;top:20px;left:40px;font-size:70px;}
#tree{position:absolute;left:10px;bottom:100px;font-size:100px;}
#house{position:absolute;right:10px;bottom:100px;font-size:100px;}
/* 풀밭을 약간 투명하게 하여 배경 이미지가 어우러지도록 수정 */
#grass{position:absolute;bottom:0;width:100%;height:90px;background:rgba(98, 179, 79, 0.7);} 

#grandma{
position:absolute;
left:25%;
bottom:80px;
width:160px;
z-index:2;
}

#student{
position:absolute;
left:50%;
bottom:80px;
width:160px;
z-index:2;
}

#box{
position:absolute;
left:50%;
transform:translateX(-50%);
bottom:190px;
font-size:70px;
z-index:3;
transition:.1s;
}

#effect{
position:absolute;
top:35%;
width:100%;
font-size:40px;
font-weight:bold;
color:#ff9800;
opacity:0;
}

#result{
display:none;
position:absolute;
top:35%;
width:100%;
font-size:35px;
font-weight:bold;
color:#e91e63;
z-index:5;
}
</style>
</head>

<body>

<h1>👵 할머니 짐 들어드리기</h1>

<div id="info">
도움 : <span id="count">0</span>/100 
시간 : <span id="time">12</span>초
</div>

<div id="bar">
<div id="timeBar"></div>
</div>

<div id="game">

<div id="cloud">☁️</div>
<div id="tree">🌳</div>
<div id="house">🏠</div>


<div id="grandma">
<svg viewBox="0 0 200 280">

<ellipse cx="100" cy="230" rx="55" ry="50" fill="#d98fa5"/>
<ellipse cx="100" cy="100" rx="60" ry="65" fill="#f3c79d"/>

<path d="M40 100 Q35 20 100 20 Q165 20 160 100 Q130 55 40 100" fill="#eee"/>

<circle cx="75" cy="100" r="18" stroke="#555" stroke-width="4" fill="none"/>
<circle cx="125" cy="100" r="18" stroke="#555" stroke-width="4" fill="none"/>

<circle cx="75" cy="100" r="5"/>
<circle cx="125" cy="100" r="5"/>

<path id="gmouth" d="M75 150 Q100 130 125 150" stroke="#333" stroke-width="5" fill="none"/>

<line x1="65" y1="190" x2="100" y2="220" stroke="#f3c79d" stroke-width="12"/>

</svg>
</div>



<div id="student">
<svg viewBox="0 0 200 280">

<rect x="55" y="180" width="90" height="90" rx="15" fill="#3f72af"/>

<ellipse cx="100" cy="100" rx="55" ry="65" fill="#f3c79d"/>

<path d="M45 95 Q60 30 100 35 Q140 30 155 95" fill="#333"/>

<circle cx="75" cy="100" r="5"/>
<circle cx="125" cy="100" r="5"/>

<path id="smouth" d="M75 145 Q100 130 125 145" stroke="#333" stroke-width="5" fill="none"/>

<line x1="60" y1="200" x2="100" y2="220" stroke="#f3c79d" stroke-width="14"/>
<line x1="140" y1="200" x2="100" y2="220" stroke="#f3c79d" stroke-width="14"/>

</svg>
</div>


<div id="box">📦</div>

<div id="effect">영차! 💪</div>

<div id="result"></div>

<div id="grass"></div>

</div>


<script>

let count=0;
let time=12;
let maxTime=12;
let end=false;
let lastClick=0;


setInterval(()=>{

if(end)return;

time-=0.08;

document.getElementById("time").innerText=Math.ceil(time);

document.getElementById("timeBar").style.width=
(time/maxTime*100)+"%";

if(time<=0){
finish(false);
}

},100);



document.body.addEventListener("pointerdown",()=>{

if(end)return;

let now=Date.now();
let gap=now-lastClick;
lastClick=now;

count++;

document.getElementById("count").innerText=count;


if(gap<220){

time=Math.min(maxTime,time+0.08);

}
else if(gap>600){

time-=0.4;

}


document.getElementById("box").style.bottom=
(190+count*1.45)+"px";



let percent=count/100;


if(percent<0.4){

document.getElementById("gmouth")
.setAttribute("d","M75 150 Q100 130 125 150");

}
else if(percent<0.8){

document.getElementById("gmouth")
.setAttribute("d","M75 145 Q100 145 125 145");

}
else{

document.getElementById("gmouth")
.setAttribute("d","M70 135 Q100 175 130 135");

}



document.getElementById("student").style.transform="translateY(-10px)";
document.getElementById("grandma").style.transform="translateY(-5px)";


setTimeout(()=>{

document.getElementById("student").style.transform="";
document.getElementById("grandma").style.transform="";

},100);


document.getElementById("effect").style.opacity=1;

setTimeout(()=>{

document.getElementById("effect").style.opacity=0;

},120);



if(count>=100){

finish(true);

}

});



function finish(win){

end=true;

let r=document.getElementById("result");

if(win){

r.innerHTML="9번째 코드는 6";

}else{

r.innerHTML="실패";

}

r.style.display="block";

}

</script>

</body>
</html>
