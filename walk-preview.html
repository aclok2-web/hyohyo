<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효효 — 걷기 애니메이션 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101721;color:#eaf0f6;font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:0 0 10px}p{color:#adbdcf;line-height:1.6}nav,.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}button,select,a{font:inherit;color:#eaf0f6;background:#253346;border:1px solid #475d76;border-radius:10px;padding:10px 14px;text-decoration:none}button{cursor:pointer}button[aria-pressed=true]{background:#406b59}label{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}article{background:#192536;border:1px solid #314357;border-radius:16px;overflow:hidden}h2{font-size:15px;margin:14px;text-align:center}.sprite{display:block;width:100%;height:auto;image-rendering:pixelated}.stage{width:100%;background:#1b2930;border:1px solid #475d76;border-radius:14px;touch-action:none;image-rendering:pixelated}.arrows{display:flex;gap:8px;justify-content:center;margin:12px}.arrows button{touch-action:none;min-width:54px}.note{font-size:13px}input{accent-color:#80c5a7}
</style></head><body><main>
<h1>캐릭터 걷기 애니메이션</h1><p>남녀 주인공과 가족 캐릭터 11종을 확인하세요. 이동 거리에 맞춰 발이 움직이고, 멈추면 기본 자세로 돌아옵니다.</p>
<nav><a href="index.html">게임에서 확인하기 →</a><span>전체 캐릭터 · 방향과 속도 확인</span></nav>
<div class="controls"><label>방향 <select id="direction"><option value="down">앞</option><option value="up">뒤</option><option value="right">오른쪽</option><option value="left">왼쪽</option></select></label><label>속도 <input id="speed" type="range" min="40" max="288" value="120"></label><button id="toggle" aria-pressed="true">걷기 재생 중 · 멈추기</button><span id="loaded" role="status">이미지 준비 중</span></div>
<section class="grid" id="grid" aria-label="전체 캐릭터"></section>
<h2 style="text-align:left;margin:32px 0 12px">직접 움직여 보기</h2><label>캐릭터 <select id="character"></select></label><p class="note">방향키 또는 WASD, 아래 버튼으로 움직여 보세요. 경계에 막히면 발 동작도 멈춥니다.</p>
<canvas class="stage" id="stage" width="960" height="260"></canvas><div class="arrows"><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="up" aria-label="위">↑</button><button data-dir="down" aria-label="아래">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div>
</main><script src="walk.js?v=20261011-walking"></script><script>
const labels={boy:'남자 주인공',girl:'여자 주인공',child_boy:'어린 나 · 남자',child_girl:'어린 나 · 여자',teen_boy:'과거의 나 · 남자',teen_girl:'과거의 나 · 여자',mom:'엄마',father:'아버지',grandmother:'할머니',parent_male:'뒷이야기 · 아버지',parent_female:'뒷이야기 · 어머니'};
const $=id=>document.getElementById(id),walk=window.HYO_WALK,actors=[],keys={};let playing=true,last=0;
for(const [id] of walk.entries){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=labels[id];const canvas=document.createElement('canvas');canvas.width=200;canvas.height=190;canvas.className='sprite';canvas.setAttribute('aria-label',labels[id]+' 걷기');article.append(heading,canvas);$('grid').append(article);actors.push({id,canvas,actor:{direction:'down',x:50,walkDistance:0}});const option=document.createElement('option');option.value=id;option.textContent=labels[id];$('character').append(option)}
$('toggle').onclick=()=>{playing=!playing;$('toggle').textContent=playing?'걷기 재생 중 · 멈추기':'정지 · 걷기 재생';$('toggle').setAttribute('aria-pressed',String(playing))};
const keyDirections={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};window.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;const d=keyDirections[e.key];if(d){e.preventDefault();keys[d]=true}});window.addEventListener('keyup',e=>{const d=keyDirections[e.key];if(d)keys[d]=false});window.addEventListener('blur',()=>{for(const d in keys)keys[d]=false});
document.querySelectorAll('[data-dir]').forEach(button=>{button.onpointerdown=e=>{e.preventDefault();keys[button.dataset.dir]=true;button.setPointerCapture(e.pointerId)};for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,()=>keys[button.dataset.dir]=false)});
const controlled={x:480,y:190,direction:'down'},stage=$('stage'),ctx=stage.getContext('2d');
function ground(c,w,h){c.clearRect(0,0,w,h);c.fillStyle='#1b2930';c.fillRect(0,0,w,h);c.strokeStyle='#293c43';for(let x=0;x<w;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=0;y<h;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}
function loop(time){const dt=Math.min(.05,(time-last)/1000||0);last=time;const speed=Number($('speed').value);for(const item of actors){item.actor.direction=$('direction').value;walk.step(item.actor,playing?speed*dt:0);const c=item.canvas.getContext('2d');ground(c,200,190);walk.draw(c,item.id,item.actor,52,172,96,128)}
const dx=Number(Boolean(keys.right))-Number(Boolean(keys.left)),dy=Number(Boolean(keys.down))-Number(Boolean(keys.up)),length=Math.hypot(dx,dy)||1,oldX=controlled.x,oldY=controlled.y;controlled.x=Math.max(48,Math.min(912,controlled.x+dx/length*speed*dt));controlled.y=Math.max(100,Math.min(248,controlled.y+dy/length*speed*dt));if(dx)controlled.direction=dx<0?'left':'right';if(dy)controlled.direction=dy<0?'up':'down';walk.step(controlled,Math.hypot(controlled.x-oldX,controlled.y-oldY));ground(ctx,960,260);walk.draw(ctx,$('character').value,controlled,controlled.x-36,controlled.y,72,96);const ready=Object.values(walk.sprites).filter(i=>i.complete&&i.naturalWidth).length;$('loaded').textContent=ready+' / 11종 준비됨';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
