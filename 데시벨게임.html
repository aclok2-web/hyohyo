<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데시벨 대결: 과거와의 사투</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            /* 운동회 배경 이미지 적용 */
            background: url('Gemini_Generated_Image_ika9fnika9fnika9.png') no-repeat center center/cover;
            color: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 배경 어둡게 처리 (가독성을 위함) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        #story-board, #battle-arena, #countdown-screen, #result-screen {
            z-index: 10;
        }

        #story-board {
            text-align: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            border: 2px solid #4facfe;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            max-width: 600px;
        }

        h1 {
            color: #ffeb3b;
            margin-top: 0;
            font-size: 2.8em;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p.context {
            color: #fff;
            font-size: 1.1em;
            line-height: 1.8;
            word-break: keep-all;
        }

        .warning {
            color: #ffb199;
            font-weight: bold;
            margin-top: 15px;
            display: inline-block;
        }

        #battle-arena {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 응원하는 부모님 이미지 */
        #parents-cheer {
            position: absolute;
            top: 15%;
            width: 300px;
            z-index: 2;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .tug-of-war-scene {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 1200px;
            margin-top: 100px;
            position: relative;
            z-index: 5;
        }

        .character-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            z-index: 10;
            transition: transform 0.1s;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5em;
            background: rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
            position: relative;
        }

        #teen-avatar { border: 5px solid #ff0844; box-shadow: 0 0 30px rgba(255, 8, 68, 0.8); }
        #me-avatar { border: 5px solid #00f2fe; box-shadow: 0 0 30px rgba(0, 242, 254, 0.8); }

        .char-name {
            font-size: 1.6em;
            font-weight: 900;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 10px;
        }

        .dialogue {
            font-size: 1.2em;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            width: 250px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid rgba(255,255,255,0.4);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: absolute;
            top: -100px;
        }

        #teen-dialogue { color: #ff5273; }
        #me-dialogue { color: #4facfe; }

        /* 줄다리기 줄 디자인 */
        .rope-container {
            flex-grow: 1;
            height: 60px;
            position: relative;
            display: flex;
            align-items: center;
            margin: 0 -20px;
            z-index: 1;
        }

        #rope {
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                #c19a6b,
                #c19a6b 10px,
                #a07855 10px,
                #a07855 20px
            );
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
        }

        #center-flag {
            position: absolute;
            top: 0;
            left: 50%;
            width: 30px;
            height: 60px;
            background-color: #ff0844;
            transform: translateX(-50%);
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            transition: left 0.1s;
        }

        .decibel-meter { 
            margin-top: 50px; 
            font-size: 1.5em; 
            color: #fff; 
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 30px;
            border: 2px solid #ffeb3b;
        }
        #volume-display { font-size: 1.8em; font-weight: 900; color: #00f2fe; }

        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            background: #e94560;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.6);
        }
        button:hover { transform: scale(1.05); background: #ff5273; }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-3px, -2px) rotate(-2deg); }
            50% { transform: translate(3px, 3px) rotate(2deg); }
            75% { transform: translate(-2px, 2px) rotate(-2deg); }
            100% { transform: translate(2px, -3px) rotate(0deg); }
        }
        .shaking { animation: shake 0.2s infinite; }

        /* 카운트다운 화면 */
        #countdown-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #ffeb3b;
            font-size: 10em;
            font-weight: 900;
            align-items: center;
            justify-content: center;
        }

        #result-screen {
            display: none;
            text-align: center;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 60px;
            border-radius: 20px;
            width: 80%; max-width: 600px;
            border: 4px solid #e94560;
        }
    </style>
</head>
<body>

    <div id="story-board">
        <h1>데시벨 대결</h1>
        <p class="context">
            과거의 옹고집은 생각보다 훨씬 강력합니다.<br>
            어설픈 목소리로는 이기적인 과거를 밀어낼 수 없습니다.<br>
            <span class="warning">[하드 모드: 소리를 크고 길게 7초 이상 유지해야 승리합니다]</span>
        </p>
        <button id="start-btn">과거와 마주하기 (마이크 허용 필요)</button>
    </div>

    <div id="countdown-screen">3</div>

    <div id="battle-arena">
        <!-- 응원하는 부모님 이미지 로드 -->
        <img src="Gemini_Generated_Image_61miex61miex61mi_2.png" id="parents-cheer" alt="응원하는 부모님">

        <div class="tug-of-war-scene">
            <div class="character-wrapper" id="teen-wrapper">
                <span class="char-name" style="color:#ff0844;">사춘기의 나</span>
                <div class="avatar" id="teen-avatar">👿</div>
                <div id="teen-dialogue" class="dialogue">"내가 뭘 잘못했는데?! 다 싫어!"</div>
            </div>

            <div class="rope-container">
                <div id="rope"></div>
                <div id="center-flag"></div>
            </div>
            
            <div class="character-wrapper" id="me-wrapper">
                <span class="char-name" style="color:#00f2fe;">현재의 나</span>
                <div class="avatar" id="me-avatar">🧑</div>
                <div id="me-dialogue" class="dialogue">"..."</div>
            </div>
        </div>

        <div class="decibel-meter">현재 진심의 크기(볼륨): <span id="volume-display">0</span></div>
    </div>

    <div id="result-screen">
        <h1 id="result-title"></h1>
        <p id="result-msg" style="font-size: 1.2em; line-height:1.8; color:#ddd;"></p>
        <button onclick="location.reload()">다시 도전하기</button>
    </div>

    <script>
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let isBattling = false;
        let battlePosition = 50; 
        let animationId;

        const startBtn = document.getElementById('start-btn');
        const storyBoard = document.getElementById('story-board');
        const battleArena = document.getElementById('battle-arena');
        const countdownScreen = document.getElementById('countdown-screen');
        const centerFlag = document.getElementById('center-flag');
        const volumeDisplay = document.getElementById('volume-display');
        
        const teenWrapper = document.getElementById('teen-wrapper');
        const meWrapper = document.getElementById('me-wrapper');
        const meDialogue = document.getElementById('me-dialogue');
        const teenDialogue = document.getElementById('teen-dialogue');
        const teenAvatar = document.getElementById('teen-avatar');
        const meAvatar = document.getElementById('me-avatar');
        const resultScreen = document.getElementById('result-screen');
        
        startBtn.addEventListener('click', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("현재 환경에서는 마이크를 사용할 수 없습니다.");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                await setupAudio(stream);
                startCountdown();
            } catch (err) {
                alert('마이크 권한을 허용하지 않았거나 장치를 찾을 수 없습니다.');
                console.error(err);
            }
        });

        async function setupAudio(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        function startCountdown() {
            storyBoard.style.display = 'none';
            battleArena.style.display = 'flex';
            countdownScreen.style.display = 'flex';
            
            let count = 3;
            countdownScreen.innerText = count;
            
            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownScreen.innerText = count;
                } else if (count === 0) {
                    countdownScreen.innerText = "당겨라!";
                    countdownScreen.style.color = "#00f2fe";
                } else {
                    clearInterval(countInterval);
                    countdownScreen.style.display = 'none';
                    startGame();
                }
            }, 1000);
        }

        function startGame() {
            isBattling = true;
            battlePosition = 50;
            centerFlag.style.left = battlePosition + '%';
            
            changeDialogue();
            setInterval(changeDialogue, 3000);
            battleLoop();
        }

        function battleLoop() {
            if (!isBattling) return;

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let averageVolume = sum / dataArray.length;
            volumeDisplay.innerText = Math.round(averageVolume);

            // 과거의 나는 계속 끌어당깁니다.
            const teenPower = 0.25 + (Math.random() * 0.1); 
            
            let myPower = 0;
            if (averageVolume > 35) {
                myPower = (averageVolume - 35) * 0.006; 
            }

            if (averageVolume > 90) {
                meAvatar.classList.add('shaking');
            } else {
                meAvatar.classList.remove('shaking');
            }

            // 게이지 계산
            battlePosition = battlePosition + teenPower - myPower;

            if (battlePosition < 0) battlePosition = 0;
            if (battlePosition > 100) battlePosition = 100;

            // 깃발 이동
            centerFlag.style.left = battlePosition + '%';

            // 캐릭터들 끌려가는 모션 (깃발 위치에 비례하여 X축 이동)
            const slideAmount = (battlePosition - 50) * 4; 
            teenWrapper.style.transform = `translateX(${slideAmount}px)`;
            meWrapper.style.transform = `translateX(${slideAmount}px)`;

            if (battlePosition <= 0) {
                endGame(true);
            } else if (battlePosition >= 100) {
                endGame(false);
            } else {
                animationId = requestAnimationFrame(battleLoop);
            }
        }

        function changeDialogue() {
            if(!isBattling) return;
            const teenLines = [
                "다 내 맘대로 할 거야!", "신경 쓰지 마, 내 인생이야!", "잔소리 좀 그만해!!"
            ];
            const meLines = [
                "영차! 넌 틀렸어!", "부모님 마음에 대못을 박지 마!", "제발 상처 주지 마!!"
            ];
            teenDialogue.innerText = `"${teenLines[Math.floor(Math.random() * teenLines.length)]}"`;
            meDialogue.innerText = `"${meLines[Math.floor(Math.random() * meLines.length)]}"`;
            
            teenAvatar.classList.add('shaking');
            setTimeout(() => teenAvatar.classList.remove('shaking'), 500);
        }

        function endGame(isWin) {
            isBattling = false;
            cancelAnimationFrame(animationId);
            
            battleArena.style.display = 'none';
            resultScreen.style.display = 'block';
            
            const title = document.getElementById('result-title');
            const msg = document.getElementById('result-msg');

            if (isWin) {
                resultScreen.style.borderColor = "#00f2fe";
                title.innerText = "승리: 후회를 극복했습니다!";
                title.style.color = "#00f2fe";
                msg.innerHTML = "엄청난 노력 끝에, 마침내 과거의 완고함을 당겨왔습니다.<br>숨이 찰 정도로 소리치며 전한 그 진심이 부모님께도 꼭 닿았을 겁니다.";
            } else {
                resultScreen.style.borderColor = "#ff0844";
                title.innerText = "패배: 과거의 벽이 너무 높습니다...";
                title.style.color = "#ff0844";
                msg.innerHTML = "사춘기 시절의 엇나갔던 감정에 그대로 끌려가버렸습니다.<br>숨을 크게 고르고, 더 크고 끈질긴 목소리로 밧줄을 다시 쥐어보세요!";
            }
        }
    </script>
</body>
</html>
