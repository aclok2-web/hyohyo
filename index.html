<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

<title>효 방탈출 : 잃어버린 마음의 지도</title>

<link rel="stylesheet" href="style.css?v=20260818-5">

</head>

<body>

<!-- ========================= -->
<!-- 게임 전체 -->
<!-- ========================= -->

<div id="game">

    <!-- 캔버스 -->
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- 검은 페이드 -->
    <div id="fade"></div>

    <!-- 방 이름 -->
    <div id="roomName">

        기억의 거실

    </div>

    <!-- 진행도 -->
    <div id="progress">

        <span>비밀번호</span>

        <div id="keys">

            □□□□□□□□□□

        </div>

    </div>

    <!-- 안내 -->
    <div id="help">

        ↑ ↓ ← → 이동

        &nbsp;&nbsp;&nbsp;

        E 조사하기

    </div>

    <!-- 대화창 -->
    <div id="dialogBox">

        <div id="speaker">

            시스템

        </div>

        <div id="dialogText">

            ...

        </div>

        <div id="next">

            ▶ ENTER

        </div>

    </div>

    <!-- 선택창 -->
    <div id="choiceBox">

        <button id="yesBtn">

            예

        </button>

        <button id="noBtn">

            아니오

        </button>

    </div>

    <!-- 미션 -->
    <div id="missionPopup">

        <h2>MISSION</h2>

        <p id="missionText">

            미션 시작

        </p>

    </div>

    <!-- 인벤토리 -->
    <div id="inventory">

        <h2>가방</h2>

        <ul id="itemList">

        </ul>

    </div>

    <!-- 시스템 메시지 -->
    <div id="systemMessage">

    </div>

    <div id="mobileControls" class="mobile-controls" aria-label="모바일 조작기">
        <div id="moveJoystick" class="move-joystick" aria-label="이동 조이스틱">
            <div id="joystickKnob" class="joystick-knob"></div>
        </div>
        <button id="mobileActionBtn" class="mobile-action" type="button">조사·대화</button>
    </div>

    <!-- 엄마 실종 후 전화 연출 -->
    <div id="momCallSequence" aria-hidden="true">
        <div id="momMissingText">엄마?????</div>
        <button id="momCallScreen" type="button" aria-label="엄마 전화 받기">
            <img id="momCallImage" alt="엄마에게 걸려 온 전화 화면">
            <span id="momCallHint">통화를 눌러 전화를 받으세요</span>
        </button>
    </div>

    <!-- 엔딩 -->
    <div id="endingScreen">

        <img id="endingVisual" alt="" />

        <h1 id="endingTitle">

            마음의 문이 열렸습니다.

        </h1>

        <p id="endingText">

            이제 부모님의 마음을 이해할 수 있을 것 같습니다.

        </p>

        <div class="ending-actions" id="endingActions">
            <button id="epilogueBtn" type="button">뒷이야기로 가기</button>
            <button id="endingRestartBtn" type="button" class="secondary">처음부터 다시하기</button>
        </div>

    </div>

    <!-- 시작화면 -->
    <div id="titleScreen">

        <h1>

            효 방탈출

        </h1>

        <h3>

            잃어버린 마음의 지도

        </h3>

        <section id="characterSelect" aria-label="주인공 선택">

            <h2>주인공을 선택하세요</h2>

            <div class="character-options">

                <button class="character-card" type="button" data-character="boy" aria-pressed="false">
                    <span class="character-preview boy-preview" aria-hidden="true"></span>
                    <strong>남자 주인공</strong>
                    <span>아버지 무시</span>
                </button>

                <button class="character-card" type="button" data-character="girl" aria-pressed="false">
                    <span class="character-preview girl-preview" aria-hidden="true"></span>
                    <strong>여자 주인공</strong>
                    <span>부모님과 소통 단절</span>
                </button>

            </div>

            <p id="characterHint">캐릭터를 선택한 뒤 이야기를 시작하세요.</p>

        </section>

        <button id="startBtn">

            이 이야기 시작하기

        </button>

    </div>

    <!-- 일시정지 -->
    <div id="pauseMenu">

        <h2>일시정지</h2>

        <button id="resumeBtn">

            계속하기

        </button>

        <button id="saveBtn">

            저장하기

        </button>

        <button id="exitBtn">

            처음으로

        </button>

    </div>

</div>

<script src="rooms.js?v=20260818-2"></script>
<script src="player.js?v=20260818-3"></script>
<script src="collision.js?v=20260818-2"></script>
<script src="dialog.js?v=20260818-4"></script>
<script src="npc.js?v=20260818-2"></script>
<script src="camera.js?v=20260818-2"></script>
<script src="save.js?v=20260818-2"></script>
<script src="main.js?v=20260818-4"></script>

</body>
</html>
