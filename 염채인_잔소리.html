<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>부모님의 잔소리 속 진심 찾기</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Malgun Gothic", "맑은 고딕", sans-serif;
}

body{

background:linear-gradient(180deg,#EAF7FF,#FFF9ED);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;

}

#container{

width:100%;
max-width:480px;
background:white;
padding:18px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);

}

h1{

text-align:center;
color:#2D5B87;
margin-bottom:20px;

}

p{

font-size:18px;
line-height:1.7;
text-align:center;

}

button{

width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
background:#4A90E2;
color:white;
transition:.3s;

}

button:hover{

background:#2E73C5;

}

#quiz{

display:none;

}

#question{

font-size:22px;
margin-bottom:25px;

}

.choice{

margin:10px 0;

}

#message{

font-size:22px;
font-weight:bold;
text-align:center;
margin-top:20px;

}

#score{

margin-top:20px;
font-size:20px;
text-align:right;

}

#result{

display:none;
text-align:center;

}

#result h2{

font-size:42px;
margin-bottom:20px;

}

#result p{

font-size:24px;
margin-bottom:15px;

}


#container{
background-size:cover;
background-position:center;
background-repeat:no-repeat;
transition:background-image .5s;
}
@media(max-width:480px){
 h1{font-size:24px;}
 #question{font-size:20px;}
 button{font-size:17px;padding:14px;}
 p{font-size:17px;}
}


html, body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:0;
}

#container{
    width:100vw;
    height:100vh;
    max-width:none;
    max-height:none;
    margin:0;
    padding:20px;
    border-radius:0;
    box-shadow:none;
    display:flex;
    flex-direction:column;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:background-image .5s ease;
    overflow-y:auto;
}

#start,
#quiz,
#result{
    width:100%;
    min-height:100%;
}

#start,
#result{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

#quiz{
    flex-direction:column;
}

#quiz[style*="display: block"]{
    display:flex !important;
}

h1{
    font-size:clamp(24px, 7vw, 34px);
    line-height:1.3;
    margin:0 0 18px;
}

#question{
    font-size:clamp(19px, 5.2vw, 25px);
    line-height:1.55;
    margin-bottom:18px;
}

#choices{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:12px;
}

.choice{
    width:100%;
    min-height:62px;
    margin:0;
    padding:15px 12px;
    font-size:clamp(17px, 4.6vw, 21px);
    line-height:1.4;
    border-radius:14px;
}

#message{
    min-height:34px;
    margin-top:14px;
    font-size:clamp(17px, 4.5vw, 21px);
    line-height:1.4;
}

#score{
    margin-top:auto;
    padding-top:12px;
    padding-bottom:max(6px, env(safe-area-inset-bottom));
    font-size:clamp(17px, 4.5vw, 21px);
}

#result h2{
    font-size:clamp(36px, 10vw, 52px);
}

#result p{
    font-size:clamp(18px, 5vw, 24px);
}

button{
    touch-action:manipulation;
}

@media (max-width:480px){
    #container{
        padding:
            max(16px, env(safe-area-inset-top))
            16px
            max(16px, env(safe-area-inset-bottom));
    }
}

@media (orientation:landscape) and (max-height:600px){
    #container{
        padding:12px 18px;
    }
    h1{
        font-size:24px;
        margin-bottom:10px;
    }
    #question{
        font-size:18px;
        margin-bottom:10px;
    }
    .choice{
        min-height:46px;
        padding:10px;
        font-size:16px;
    }
}


#result{
    overflow:hidden;
    justify-content:center;
    gap:10px;
}

#result h2{
    margin-bottom:8px;
}

#result p{
    margin-bottom:8px;
    line-height:1.35;
}

#result #finalText > div{
    margin-top:16px !important;
    padding:14px !important;
}

@media (max-height:700px){
    #container{
        padding-top:10px;
        padding-bottom:10px;
    }

    #result{
        gap:6px;
    }

    #result h2{
        font-size:34px;
        margin-bottom:4px;
    }

    #result p{
        font-size:17px;
        margin-bottom:4px;
    }

    #result #finalText > div{
        margin-top:10px !important;
        padding:10px !important;
    }
}


html,body{
    overflow:hidden !important;
    overscroll-behavior:none;
    touch-action:manipulation;
}

#container{
    overflow:hidden !important;
    height:100dvh !important;
}

#start,#quiz,#result{
    height:100%;
    overflow:hidden !important;
}

#choices{
    flex:1;
    justify-content:space-evenly !important;
}

.choice{
    min-height:56px;
}

#message{
    min-height:28px;
}

#score{
    margin-top:8px;
}

#result{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

:root{
    --family-gray: 1;
    --family-saturate: .2;
    --family-brightness: .78;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background-image:url("assets/objects/living_family_photo.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    filter:
        grayscale(var(--family-gray))
        saturate(var(--family-saturate))
        brightness(var(--family-brightness));
    transform:scale(1.04);
    transition:filter 900ms ease;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:rgba(20,18,16,.38);
}

#container{
    position:relative;
    z-index:1;
    background:rgba(255,255,255,.72) !important;
    background-image:none !important;
    backdrop-filter:blur(2px);
}

</style>

</head>

<body>

<div id="container">

<div id="start">

<h1>부모님의 잔소리 속 진심 찾기</h1>

<p>
부모님의 잔소리에는<br>
어떤 사랑과 걱정이 담겨 있을까요?<br><br>
총 6문제를 풀어보세요.
</p>

<button onclick="startGame()">
게임 시작
</button>

</div>
<div id="quiz">

<h1>부모님의 잔소리 속 진심 찾기</h1>

<div id="question"></div>

<div id="choices"></div>

<div id="message"></div>

<div id="score"></div>

</div>

<div id="result">

<h2 id="rank"></h2>

<p id="finalScore"></p>

<p id="finalText"></p>



</div>

<script>
const quiz = [
  {
    question: "엄마가 '휴대폰 좀 내려놓고 가족이랑 이야기하자'라고 말했습니다.<br><br>부모님의 진짜 마음은 무엇일까요?",
    choices: [
      "휴대폰이 싫어서",
      "가족과 함께하는 시간을 소중히 여기길 바라서",
      "심심해서"
    ],
    answer: 1
  },
  {
    question: "아빠가 '너무 늦게 다니지 말고 일찍 들어와.'라고 말했습니다.<br><br>부모님의 진짜 마음은 무엇일까요?",
    choices: [
      "친구를 못 만나게 하려고",
      "안전하게 집으로 돌아오길 바라서",
      "잔소리하고 싶어서"
    ],
    answer: 1
  },
  {
    question: "엄마가 '밥은 꼭 먹고 다녀.'라고 말했습니다.<br><br>부모님의 진짜 마음은 무엇일까요?",
    choices: [
      "건강을 챙겨주고 싶어서",
      "음식이 남아서",
      "빨리 보내려고"
    ],
    answer: 0
  },
  {
    question: "아빠가 '실수해도 괜찮아. 끝까지 해봐.'라고 말했습니다.<br><br>부모님의 진짜 마음은 무엇일까요?",
    choices: [
      "혼내려고",
      "포기하지 않는 사람이 되길 바라서",
      "시간이 남아서"
    ],
    answer: 1
  },
  {
    question: "엄마가 '오늘은 할머니께 안부 전화 한 번 드리자.'라고 말했습니다.<br><br>부모님의 진짜 마음은 무엇일까요?",
    choices: [
      "예의를 배우고 가족을 소중히 여기길 바라서",
      "전화가 좋아서",
      "심심해서"
    ],
    answer: 0
  },
  {
    question: "부모님이 '방을 스스로 정리해보자.'라고 말했습니다.<br><br>부모님의 진짜 마음은 무엇일까요?",
    choices: [
      "생활 습관과 책임감을 기르길 바라서",
      "잔소리하려고",
      "부모님 편하려고만"
    ],
    answer: 0
  }
];

let current = 0;
let score = 0;

function setBg(){
  const root = document.documentElement;
  let gray = 1;
  let saturate = .2;
  let brightness = .78;

  if(score >= 6){
    gray = 0;
    saturate = 1.12;
    brightness = 1;
  }else if(score >= 4){
    gray = .35;
    saturate = .82;
    brightness = .92;
  }else if(score >= 2){
    gray = .68;
    saturate = .5;
    brightness = .85;
  }

  root.style.setProperty('--family-gray', gray);
  root.style.setProperty('--family-saturate', saturate);
  root.style.setProperty('--family-brightness', brightness);
}

function startGame() {
  document.getElementById("start").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  setBg();
  showQuestion();
}

function showQuestion() {
  if (current >= quiz.length) {
    finishGame();
    return;
  }

  setBg();
  document.getElementById("question").innerHTML = quiz[current].question;
  document.getElementById("message").innerHTML = "";

  let html = "";
  for (let i = 0; i < quiz[current].choices.length; i++) {
    html += `<button class="choice" onclick="checkAnswer(${i})">${quiz[current].choices[i]}</button>`;
  }

  document.getElementById("choices").innerHTML = html;
  document.getElementById("score").innerHTML = "현재 점수 : " + score + " / " + quiz.length;
}

function checkAnswer(num) {
  if (num === quiz[current].answer) {
    score++;
    setBg();
    document.getElementById("message").style.color = "green";
    document.getElementById("message").innerHTML = "정답입니다. 부모님의 사랑이 담긴 말이었어요.";
    document.querySelectorAll(".choice").forEach(b => b.disabled = true);
    current++;
    setTimeout(showQuestion, 1200);
  } else {
    document.getElementById("message").style.color = "red";
    document.getElementById("message").innerHTML = "다시 생각해보세요. 말 뒤에 숨은 걱정을 떠올려봐요.";
  }
}

function finishGame() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";
  setBg();

  document.getElementById("finalScore").innerHTML = "최종 점수 : " + score + " / " + quiz.length;

  if (score === 6) {
    document.getElementById("rank").innerHTML = "효 온도 최고";
    document.getElementById("finalText").innerHTML = "부모님의 사랑과 걱정을 모두 이해했습니다!";
  } else if (score >= 4) {
    document.getElementById("rank").innerHTML = "따뜻한 마음";
    document.getElementById("finalText").innerHTML = "부모님의 마음을 이해하려는 따뜻한 마음이 느껴집니다.";
  } else {
    document.getElementById("rank").innerHTML = "효도 실천가";
    document.getElementById("finalText").innerHTML = "오늘을 계기로 부모님의 진심을 한 번 더 생각해보세요.";
  }

  document.getElementById("finalText").innerHTML += `
    <div style="margin-top:30px;padding:15px;background:#FFF3CD;border:2px solid #FFD54F;border-radius:12px;text-align:center;">
      <p style="font-size:22px;font-weight:bold;margin:0;line-height:1.5;color:#d62828;">3번째 비밀번호는 O입니다.</p>
    </div>
  `;

  if (score === quiz.length) {
    localStorage.setItem("nagging_quiz_complete", String(Date.now()));
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: "nagging-quiz-complete" }, "*");
    }
    setTimeout(() => {
      window.close();
      if (!window.closed && history.length > 1) history.back();
    }, 5000);
  }
}
</script>
    
</body>
</html>
