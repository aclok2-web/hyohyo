<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50년 뒤의 나</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    color: #f5efe7;
    background:
      radial-gradient(circle at 50% 12%, rgba(236, 206, 150, .18), transparent 34%),
      linear-gradient(180deg, #181413 0%, #2b211c 52%, #12100f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px;
  }

  .app {
    width: min(980px, 100%);
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
    align-items: stretch;
  }

  .panel,
  .stage {
    border: 1px solid rgba(255, 232, 188, .22);
    background: rgba(28, 22, 19, .82);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
    border-radius: 8px;
  }

  .panel {
    padding: 18px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 28px;
    letter-spacing: 0;
  }

  p {
    margin: 0 0 18px;
    line-height: 1.65;
    color: #d6c8b6;
    font-size: 14px;
  }

  video,
  canvas {
    width: 100%;
    display: block;
    background: #0c0b0b;
    border-radius: 6px;
  }

  video {
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,.12);
  }

  .controls {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  button,
  label.file {
    appearance: none;
    border: 0;
    border-radius: 7px;
    padding: 13px 14px;
    font: inherit;
    font-weight: 700;
    color: #1a130f;
    background: #f0c66b;
    cursor: pointer;
    text-align: center;
  }

  button.secondary,
  label.file {
    color: #f7ead7;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255,255,255,.18);
  }

  button:disabled {
    opacity: .45;
    cursor: not-allowed;
  }

  input[type="file"] {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .stage {
    padding: 18px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 620px;
  }

  .stage-title {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    color: #f4d89b;
    font-weight: 800;
  }

  .badge {
    color: #cbbca9;
    font-size: 13px;
    font-weight: 500;
  }

  .canvas-wrap {
    display: grid;
    place-items: center;
    min-height: 0;
  }

  canvas {
    max-height: 560px;
    object-fit: contain;
    border: 1px solid rgba(255,255,255,.16);
  }

  .notice {
    margin-top: 12px;
    color: #d8cdbf;
    font-size: 13px;
    line-height: 1.55;
  }

  @media (max-width: 820px) {
    body {
      align-items: start;
      padding: 12px;
    }

    .app {
      grid-template-columns: 1fr;
    }

    .stage {
      min-height: auto;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>50년 뒤의 나</h1>
      <p>카메라로 사진을 찍거나 이미지를 올리면, 브라우저 안에서 나이 든 느낌의 사진으로 바꿔줍니다.</p>

      <video id="camera" autoplay playsinline muted></video>

      <div class="controls">
        <button id="cameraBtn" type="button">카메라 켜기</button>
        <button id="captureBtn" type="button" class="secondary" disabled>사진 찍기</button>
        <label class="file" for="cameraInput">아이폰으로 바로 찍기</label>
        <input id="cameraInput" type="file" accept="image/*" capture="user">
        <label class="file" for="fileInput">사진 올리기</label>
        <input id="fileInput" type="file" accept="image/*">
        <button id="ageBtn" type="button" disabled>50년 뒤로 바꾸기</button>
        <button id="downloadBtn" type="button" class="secondary" disabled>사진 저장하기</button>
      </div>

      <div class="notice">
        사진은 외부로 전송되지 않고 현재 브라우저에서만 처리됩니다. 아이폰에서는 "아이폰으로 바로 찍기"를 누르면 카메라 촬영이 가장 안정적으로 작동합니다.
      </div>
    </section>

    <section class="stage">
      <div class="stage-title">
        <span>변환 결과</span>
        <span id="status" class="badge">사진을 준비해주세요</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="result" width="720" height="900"></canvas>
      </div>
    </section>
  </main>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("result");
const ctx = canvas.getContext("2d");
const cameraBtn = document.getElementById("cameraBtn");
const captureBtn = document.getElementById("captureBtn");
const ageBtn = document.getElementById("ageBtn");
const downloadBtn = document.getElementById("downloadBtn");
const fileInput = document.getElementById("fileInput");
const cameraInput = document.getElementById("cameraInput");
const statusText = document.getElementById("status");

let stream = null;
let sourceImage = null;

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function setStatus(text) {
  statusText.textContent = text;
}

function fitRect(srcW, srcH, dstW, dstH) {
  const scale = Math.min(dstW / srcW, dstH / srcH);
  const w = srcW * scale;
  const h = srcH * scale;
  return { x: (dstW - w) / 2, y: (dstH - h) / 2, w, h };
}

function drawSource(image) {
  const ratio = image.width / image.height;
  canvas.width = ratio >= 1 ? 900 : 720;
  canvas.height = ratio >= 1 ? 720 : 900;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const r = fitRect(image.width, image.height, canvas.width, canvas.height);
  ctx.drawImage(image, r.x, r.y, r.w, r.h);
  sourceImage = image;
  ageBtn.disabled = false;
  downloadBtn.disabled = true;
  setStatus("원본 준비 완료");
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cameraInput.click();
    setStatus("사진 촬영 화면을 열었습니다");
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 1600 } },
      audio: false
    });
    video.srcObject = stream;
    captureBtn.disabled = false;
    setStatus("카메라가 켜졌습니다");
  } catch (error) {
    if (isIOS) cameraInput.click();
    setStatus("권한이 막히면 아이폰으로 바로 찍기를 사용해주세요");
  }
}

function capturePhoto() {
  if (!video.videoWidth) return;
  const photo = document.createElement("canvas");
  photo.width = video.videoWidth;
  photo.height = video.videoHeight;
  const pctx = photo.getContext("2d");
  pctx.translate(photo.width, 0);
  pctx.scale(-1, 1);
  pctx.drawImage(video, 0, 0, photo.width, photo.height);

  const image = new Image();
  image.onload = () => drawSource(image);
  image.src = photo.toDataURL("image/png");
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const image = new Image();
    image.onload = () => drawSource(image);
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function applyBaseAging() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const p = data.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i];
    const g = p[i + 1];
    const b = p[i + 2];
    const gray = r * .32 + g * .36 + b * .32;
    p[i] = Math.min(255, gray * .54 + r * .48 + 12);
    p[i + 1] = Math.min(255, gray * .54 + g * .42 + 10);
    p[i + 2] = Math.min(255, gray * .58 + b * .36 + 6);
  }
  ctx.putImageData(data, 0, 0);
}

function strokeWrinkle(x, y, w, amp, alpha, seed) {
  ctx.beginPath();
  for (let i = 0; i <= 18; i++) {
    const t = i / 18;
    const px = x + w * t;
    const py = y + Math.sin((t * Math.PI * 2) + seed) * amp + Math.sin(t * 16 + seed) * 1.2;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = `rgba(54, 38, 30, ${alpha})`;
  ctx.lineWidth = Math.max(1, canvas.width * .002);
  ctx.stroke();
  ctx.strokeStyle = `rgba(255, 232, 210, ${alpha * .28})`;
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawAgingDetails() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const faceW = canvas.width * .46;

  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "rgba(65, 48, 42, .14)";
  ctx.beginPath();
  ctx.ellipse(cx - faceW * .22, cy - canvas.height * .03, faceW * .12, canvas.height * .065, -.18, 0, Math.PI * 2);
  ctx.ellipse(cx + faceW * .22, cy - canvas.height * .03, faceW * .12, canvas.height * .065, .18, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(80, 56, 44, .12)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + canvas.height * .18, faceW * .34, canvas.height * .045, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.lineCap = "round";
  for (let i = 0; i < 5; i++) {
    strokeWrinkle(cx - faceW * .33, cy - canvas.height * (.185 - i * .024), faceW * .66, 2.2, .2 - i * .018, i * .8);
  }
  for (let i = 0; i < 4; i++) {
    strokeWrinkle(cx - faceW * .38, cy + canvas.height * (.05 + i * .035), faceW * .24, 1.8, .16, i * .9);
    strokeWrinkle(cx + faceW * .14, cy + canvas.height * (.05 + i * .035), faceW * .24, 1.8, .16, i * .9 + 2);
  }
  ctx.restore();

  ctx.save();
  const hairGrad = ctx.createLinearGradient(0, canvas.height * .1, 0, canvas.height * .48);
  hairGrad.addColorStop(0, "rgba(240,240,230,.55)");
  hairGrad.addColorStop(.45, "rgba(220,220,210,.2)");
  hairGrad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.globalCompositeOperation = "screen";
  ctx.fillStyle = hairGrad;
  ctx.beginPath();
  ctx.ellipse(cx, canvas.height * .27, faceW * .52, canvas.height * .18, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = "rgba(120, 92, 68, .2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

function agePhoto() {
  if (!sourceImage) return;
  drawSource(sourceImage);
  applyBaseAging();
  drawAgingDetails();
  downloadBtn.disabled = false;
  setStatus("50년 뒤 사진 완성");
}

function downloadPhoto() {
  const imageUrl = canvas.toDataURL("image/png");

  if (isIOS) {
    const win = window.open();
    if (win) {
      win.document.write(`<img src="${imageUrl}" style="max-width:100%;height:auto;display:block;margin:0 auto;">`);
      win.document.title = "50년뒤의나";
      setStatus("새 탭에서 이미지를 길게 눌러 저장하세요");
      return;
    }
  }

  const link = document.createElement("a");
  link.download = "50년뒤의나.png";
  link.href = imageUrl;
  link.click();
}

cameraBtn.addEventListener("click", startCamera);
captureBtn.addEventListener("click", capturePhoto);
ageBtn.addEventListener("click", agePhoto);
downloadBtn.addEventListener("click", downloadPhoto);
fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));
cameraInput.addEventListener("change", () => loadFile(cameraInput.files[0]));

ctx.fillStyle = "#12100f";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = "#d9c4a6";
ctx.font = "24px Malgun Gothic, sans-serif";
ctx.textAlign = "center";
ctx.fillText("사진을 찍거나 올려주세요", canvas.width / 2, canvas.height / 2);
</script>
</body>
</html>
