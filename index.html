<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050506">

<title>효 방탈출 : 마음이 남아 있는 집</title>

<link rel="stylesheet" href="style.css?v=20261010-mobile-arrows">

<style>
body.opening-active{overflow:hidden}
body.opening-active #game{visibility:hidden}
#openingOverlay{position:fixed;inset:0;z-index:100000;background:#08090d}
#openingOverlay[hidden]{display:none}
#openingFrame{display:block;border:0;width:100%;height:100%;background:#08090d}
#openingReplayBtn{display:block;margin:12px auto 0;padding:9px 16px;border:1px solid #a78b57;border-radius:8px;background:#171319;color:#e9d8b8;cursor:pointer;font:inherit;font-size:13px}
</style>
<link rel="stylesheet" href="photo-recognition.css?v=20261012">
</head>

<body class="opening-active">
<div id="openingOverlay"></div>

<!-- ========================= -->
<!-- 게임 전체 -->
<!-- ========================= -->

<div id="game">

    <!-- 캔버스 -->
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- 검은 페이드 -->
    <div id="fade"></div>

    <!-- 방 이름 -->
    <div id="roomName">

        기억의 거실

    </div>

    <!-- 진행도 -->
    <div id="progress">

        <span>비밀번호</span>

        <div id="keys">

            □□□□□□□□□□

        </div>

    </div>

    <!-- 안내 -->
    <div id="help">

        ↑ ↓ ← → 이동

        &nbsp;&nbsp;&nbsp;

        E 조사하기

    </div>

    <!-- 대화창 -->
    <div id="dialogBox">

        <div id="speaker">

            시스템

        </div>

        <div id="dialogText">

            ...

        </div>

        <div id="next">

            ▶ ENTER

        </div>

    </div>

    <!-- 선택창 -->
    <div id="choiceBox">

        <button id="yesBtn">

            예

        </button>

        <button id="noBtn">

            아니오

        </button>

    </div>

    <!-- 미션 -->
    <div id="missionPopup">

        <h2>MISSION</h2>

        <p id="missionText">

            미션 시작

        </p>

    </div>

    <!-- 인벤토리 -->
    <div id="inventory">

        <h2>가방</h2>

        <ul id="itemList">

        </ul>

    </div>

    <!-- 시스템 메시지 -->
    <div id="systemMessage">

    </div>

    <div id="mobileControls" class="mobile-controls" aria-label="모바일 조작기">
        <div class="mobile-dpad" aria-label="이동 방향">
            <button type="button" data-move="up" aria-label="위로 이동">↑</button>
            <button type="button" data-move="left" aria-label="왼쪽으로 이동">←</button>
            <button type="button" data-move="down" aria-label="아래로 이동">↓</button>
            <button type="button" data-move="right" aria-label="오른쪽으로 이동">→</button>
        </div>
        <button id="mobileActionBtn" class="mobile-action" type="button">조사·대화</button>
    </div>

    <!-- 엄마 실종 후 전화 연출 -->
    <div id="momCallSequence" aria-hidden="true">
        <div id="momMissingText">엄마?????</div>
        <button id="momCallScreen" type="button" aria-label="엄마 전화 받기">
            <img id="momCallImage" alt="엄마에게 걸려 온 전화 화면">
            <span id="momCallHint">통화를 눌러 전화를 받으세요</span>
        </button>
    </div>

    <!-- 엔딩 -->
    <div id="endingScreen">

        <img id="endingVisual" alt="" />

        <h1 id="endingTitle">

            마음의 문이 열렸습니다.

        </h1>

        <p id="endingText">

            이제 부모님의 마음을 이해할 수 있을 것 같습니다.

        </p>

        <div class="ending-actions" id="endingActions">
            <button id="epilogueBtn" type="button">뒷이야기로 가기</button>
            <button id="endingRestartBtn" type="button" class="secondary">처음부터 다시하기</button>
        </div>

    </div>

    <!-- 시작화면 -->
    <div id="titleScreen">

        <h1>

            효 방탈출

        </h1>

        <h3>

            마음이 남아 있는 집

        </h3>

        <section id="characterSelect" aria-label="주인공 선택">

            <h2>주인공을 선택하세요</h2>

            <div class="character-options">

                <button class="character-card" type="button" data-character="boy" aria-pressed="false">
                    <span class="character-preview boy-preview" aria-hidden="true"></span>
                    <strong>남자 주인공</strong>
                    <span>가족의 기억을 찾으려는 자</span>
                </button>

                <button class="character-card" type="button" data-character="girl" aria-pressed="false">
                    <span class="character-preview girl-preview" aria-hidden="true"></span>
                    <strong>여자 주인공</strong>
                    <span>가족의 마음을 되찾으려는 자</span>
                </button>

            </div>

            <p id="characterHint">캐릭터를 선택한 뒤 이야기를 시작하세요.</p>

        </section>

        <button id="startBtn">

            이 이야기 시작하기

        </button>

        <button id="openingReplayBtn" type="button">오프닝 다시 보기</button>

    </div>

    <!-- 일시정지 -->
    <div id="pauseMenu">

        <h2>일시정지</h2>

        <button id="resumeBtn">

            계속하기

        </button>

        <button id="saveBtn">

            저장하기

        </button>

        <button id="exitBtn">

            처음으로

        </button>

    </div>

</div>

<script src="photo-recognition.js?v=20261012"></script>
<script src="opening.js?v=20261012-story"></script>
<script src="constants.js?v=20261010-pacing"></script>
<script src="rooms.js?v=20261010-mobile-arrows"></script>
<script src="story.js?v=20261012-story"></script>
<script src="walk.js?v=20261011-walking"></script>
<script src="player.js?v=20261011-walking"></script>
<script src="collision.js?v=20261010-mobile-arrows"></script>
<script src="dialog.js?v=20260818-4"></script>
<script src="npc.js?v=20261011-walking"></script>
<script src="camera.js?v=20260818-2"></script>
<script src="save.js?v=20260818-2"></script>
  <script src="main.js?v=20261012-mosaic"></script>

</body>
</html>
