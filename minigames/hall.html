<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복도 미니게임</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #20242b; color: #fff; font-family: "Malgun Gothic", sans-serif; }
    main { width: min(720px, calc(100vw - 32px)); padding: 32px; border: 3px solid #fff; border-radius: 8px; background: #365f7f; text-align: center; }
    h1 { margin: 0 0 12px; }
    p { line-height: 1.6; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #ffd966; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>복도</h1>
    <p>할머니의 짐을 들어드리는 효 행동 퀴즈 연결 화면입니다.</p>
    <button onclick="window.close(); history.back();">돌아가기</button>
  </main>
</body>
</html>
